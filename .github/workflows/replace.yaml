name: Bulk Replace
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
           token: ${{ secrets.MY_PAT }}
      - name: Find and Replace
        uses: jacobtomlinson/gha-find-replace@v3
        with:
          find: "archeox_"
          replace: ARCHEOX_"
       
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install rnr
        run: |
            cargo install rnr
            rnr --help
      - name: Run rnr to rename files
        run: rnr regex -f -r 'omarchy-' 'archeox-' ./*
      - name: Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-replace old names"
          token: ${{ secrets.MY_PAT }}