name: ShellCheck

on:
  push:
    paths:
      - "build-iso"
      - "ARCHEOXlinux-installer"
  pull_request:
    paths:
      - "build-iso"
      - "ARCHEOXlinux-installer"
jobs:
  shellcheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@1.1.0